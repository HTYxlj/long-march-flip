<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8A1C1C">
<title>长征事件限时翻牌 · 纪念长征胜利 90 周年</title>
<!-- v2：真实采样音效 / 配对消灭表演 / 连击奖励 / 通关欢呼 / 无障碍与计分修复 -->

<!-- ============================================================
  字体：庄重衬线（宋体系统 fallback），走自托管镜像，不依赖外网 Google
  ============================================================ -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap">

<style>
/* ============================================================
   一、设计令牌（Design Tokens）—— 红色国风色板
   主色：深红 / 米黄 / 金色，庄重肃穆，禁止卡通低幼风格
   ============================================================ */
:root {
  --crimson:        #8A1C1C;   /* 主深红：卡牌背面 / 按钮 */
  --crimson-deep:   #6F1414;   /* 深红加深：按压 / 边框 */
  --crimson-ink:    #5E1010;   /* 最深的红，用于阴影 */
  --gold:           #C9A227;   /* 主金：装饰线 / 强调 */
  --gold-bright:    #DFC063;   /* 亮金：配对成功高亮 */
  --gold-pale:      #EAD9A8;   /* 浅金：细纹描边 */
  --parchment:      #F6EFDF;   /* 浅米黄：页面背景 */
  --parchment-card: #FBF6EA;   /* 米黄更浅：卡牌正面底 */
  --ink:            #2E2218;   /* 墨色：正文文字 */
  --ink-soft:       #5C4B38;   /* 次级墨色 */
  --danger:         #C82A20;   /* 警示红：倒计时最后阶段 */
  --radius:         10px;      /* 克制的圆角，国风不花哨 */
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
}

body {
  font-family: var(--serif);
  background: var(--parchment);
  color: var(--ink);
  /* 背景：浅米黄纸面 + 极淡的红色底纹，营造宣纸质感 */
  background-image:
    radial-gradient(circle at 18% 12%, rgba(138, 28, 28, 0.045) 0, transparent 34%),
    radial-gradient(circle at 85% 88%, rgba(201, 162, 39, 0.06) 0, transparent 38%);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overflow-x: hidden;
}

/* ============================================================
   二、通用装饰元素
   五角星（SVG 内联描边）与金色饰线，构成国风签名元素
   ============================================================ */
.star-mark {
  display: inline-flex;
  color: var(--gold);
}
.star-mark svg {
  width: 1em;
  height: 1em;
}

.gold-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--gold);
  margin: 0 auto;
  max-width: 260px;
}
.gold-rule::before,
.gold-rule::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
}
.gold-rule .star-mark { font-size: 14px; }

/* ============================================================
   三、视图容器
   ============================================================ */
.view {
  display: none;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  padding:
    calc(18px + env(safe-area-inset-top))
    18px
    calc(18px + env(safe-area-inset-bottom));
  flex-direction: column;
}
.view.active { display: flex; }

/* ============================================================
   四、首页
   ============================================================ */
.home-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 22px;
}

.home-emblem { font-size: 40px; }

.home-title {
  font-size: clamp(30px, 8.5vw, 46px);
  font-weight: 900;
  letter-spacing: 0.12em;
  color: var(--crimson);
  line-height: 1.3;
}

.home-subtitle {
  font-size: clamp(15px, 4vw, 18px);
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--gold);
  margin-top: -12px;
}

.home-subtitle-2 {
  font-size: clamp(13px, 3.6vw, 16px);
  font-weight: 600;
  letter-spacing: 0.26em;
  color: var(--crimson);
  margin-top: -8px;
  opacity: 0.92;
}

.home-intro {
  font-size: clamp(14px, 3.8vw, 16px);
  line-height: 1.9;
  color: var(--ink-soft);
  max-width: 420px;
  letter-spacing: 0.04em;
}

.home-intro strong { color: var(--crimson); font-weight: 700; }

/* 开始游戏按钮：深红底金字，大触控区 */
.btn-primary {
  appearance: none;
  border: 1px solid var(--gold);
  background: linear-gradient(180deg, var(--crimson), var(--crimson-deep));
  color: var(--gold-bright);
  font-family: var(--serif);
  font-size: clamp(18px, 5vw, 22px);
  font-weight: 900;
  letter-spacing: 0.35em;
  text-indent: 0.35em; /* 平衡字距带来的视觉偏移 */
  padding: 16px 46px;
  border-radius: var(--radius);
  box-shadow: 0 4px 0 var(--crimson-ink), 0 8px 18px rgba(94, 16, 16, 0.25);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  min-height: 56px;
}
.btn-primary:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--crimson-ink), 0 4px 10px rgba(94, 16, 16, 0.2);
}
.btn-primary:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

/* 制作人署名（首页底部） */
.credit {
  margin-top: 34px;
  font-size: 13px;
  letter-spacing: 0.22em;
  color: var(--ink-soft);
  opacity: 0.85;
}

/* ============================================================
   五、游戏面板
   ============================================================ */
.game-topbar {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

/* 倒计时徽章：左上角，数字醒目 */
.timer-badge {
  display: flex;
  align-items: center;
  gap: 9px;
  background: linear-gradient(180deg, var(--crimson), var(--crimson-deep));
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  padding: 8px 16px;
  box-shadow: 0 3px 0 var(--crimson-ink);
  color: var(--gold-bright);
  font-weight: 700;
  letter-spacing: 0.08em;
}
.timer-badge .timer-icon { font-size: 17px; color: var(--gold); }
.timer-badge .timer-text {
  font-size: 27px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  min-width: 1.6em;
  text-align: center;
}
.timer-badge .timer-unit { font-size: 12px; opacity: 0.85; }

/* 倒计时最后 10 秒的视觉警示：红字 + 脉冲 */
.timer-badge.danger {
  background: linear-gradient(180deg, var(--danger), #A31F16);
  animation: timer-pulse 0.8s ease-in-out infinite;
}
.timer-badge.danger .timer-text,
.timer-badge.danger .timer-unit { color: #FFF3E0; }
.timer-badge.danger .timer-icon { color: #FFE7A3; }

@keyframes timer-pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}

/* 进度徽章：右上角显示已完成组数 */
.progress-badge {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  padding: 8px 14px;
  background: var(--parchment-card);
  border: 1px solid var(--gold-pale);
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 13px;
  letter-spacing: 0.08em;
}
.progress-badge .progress-num {
  font-size: 22px;
  font-weight: 900;
  color: var(--crimson);
  font-variant-numeric: tabular-nums;
}
.progress-badge .progress-num b { color: var(--ink-soft); font-weight: 700; }

/* 顶栏右侧：进度徽章 + 音效开关 */
.topbar-right {
  display: flex;
  align-items: stretch;
  gap: 8px;
}

/* 音效开关按钮 */
.btn-sound {
  appearance: none;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 48px;
  min-height: 48px;
  padding: 0 11px;
  border: 1px solid var(--gold-pale);
  background: var(--parchment-card);
  border-radius: var(--radius);
  color: var(--crimson);
  cursor: pointer;
  transition: transform 0.15s ease;
}
.btn-sound svg { width: 20px; height: 20px; }
.btn-sound .sound-off { display: none; }
.btn-sound.muted .sound-on { display: none; }
.btn-sound.muted .sound-off { display: block; }
.btn-sound:active { transform: translateY(2px); }
.btn-sound:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

/* ============================================================
   六、卡牌网格
   移动端 4 列自适应；宽屏（≥640px）7 列 × 2 行
   ============================================================ */
.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(9px, 2.6vw, 14px);
  width: 100%;
  margin: 0 auto;
}

@media (min-width: 640px) {
  .board { grid-template-columns: repeat(7, 1fr); }
}

/* ---------- 卡牌本体（3D 翻转容器） ---------- */
.card {
  position: relative;
  aspect-ratio: 0.75;           /* 3:4 竖版卡牌 */
  perspective: 800px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.card.done { cursor: default; }

.card-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0.1, 0.2, 1);
}
.card.flipped .card-inner { transform: rotateY(180deg); }

/* 卡面通用：背面与正面共享定位 */
.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ---------- 卡牌背面：深红 + 金色双线框 + 金五角星 ---------- */
.card-back {
  background: linear-gradient(160deg, var(--crimson) 0%, var(--crimson-deep) 100%);
  border: 2px solid var(--gold);
  box-shadow: inset 0 0 0 1px rgba(223, 192, 99, 0.55), inset 0 0 0 5px var(--crimson-deep), 0 2px 6px rgba(94, 16, 16, 0.28);
}
/* 四角金色角饰（回纹变体，用两层伪元素拼 L 形角标） */
.card-back::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(223, 192, 99, 0.85);
  border-radius: 6px;
  pointer-events: none;
}
.card-back::after {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid rgba(223, 192, 99, 0.35);
  border-radius: 4px;
  pointer-events: none;
}

.card-back .back-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  color: var(--gold-bright);
}
.back-star { font-size: clamp(26px, 7vw, 34px); }
.back-star svg { width: 1em; height: 1em; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35)); }
.back-word {
  font-size: clamp(11px, 3vw, 14px);
  font-weight: 700;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  opacity: 0.92;
}

/* ---------- 卡牌正面：米黄 + 金色细框 + 事件名（占位图位） ---------- */
.card-front {
  background: var(--parchment-card);
  border: 1px solid var(--gold-pale);
  transform: rotateY(180deg);
  box-shadow: inset 0 0 0 1px var(--parchment-card), inset 0 0 0 4px rgba(201, 162, 39, 0.16);
  padding: 6px;
}

/* 事件占位：默认显示事件名；填入图片后由图片覆盖（见下） */
.front-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 6px;
}
.front-placeholder .front-star {
  font-size: clamp(13px, 3.4vw, 17px);
  color: var(--gold);
}
.front-placeholder .front-name {
  font-size: clamp(13px, 3.6vw, 16px);
  font-weight: 900;
  letter-spacing: 0.1em;
  color: var(--crimson);
  text-align: center;
  line-height: 1.35;
  writing-mode: horizontal-tb;
}
.front-placeholder .front-tag {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-soft);
  opacity: 0.7;
}

/* ---------- 真实插图位（预留替换点） ----------
   替换方法：在下方 JS 的 CARDS 配置中，为每个事件填入 AI 生成的图片 URL，
   例如 { name: "遵义会议", img: "https://..." }。
   填入后本图片会自动覆盖占位文字，无需改动其它代码。
--------------------------------------------------- */
.card-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: calc(var(--radius) - 2px);
  display: none;
}
.card.has-img .card-img { display: block; }
.card.has-img .front-placeholder { display: none; }

/* 图片模式下的事件名标签：金色底条盖在图片底部，图文并茂 */
.front-name-tag {
  position: absolute;
  left: 7px;
  right: 7px;
  bottom: 7px;
  background: rgba(201, 162, 39, 0.94);
  color: var(--crimson);
  font-size: clamp(10px, 2.9vw, 13px);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-indent: 0.12em;
  text-align: center;
  padding: 3px 2px;
  border-radius: 4px;
  display: none;
  white-space: nowrap;
}
.card.has-img .front-name-tag { display: block; }

/* ---------- 配对成功的正面状态：金色高亮描边 ---------- */
.card.matched .card-front {
  border-color: var(--gold);
  box-shadow: inset 0 0 0 1px var(--gold-bright), 0 0 0 3px rgba(223, 192, 99, 0.55), 0 0 14px rgba(201, 162, 39, 0.45);
}
.card.matched .card-back { border-color: var(--gold-bright); }
.card.matched { animation: match-pop 0.5s ease; }

@keyframes match-pop {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.07); }
  100% { transform: scale(1); }
}

/* ============================================================
   七、游戏内操作按钮：重新开始 / 结束挑战
   ============================================================ */
.game-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}

.btn-restart {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  appearance: none;
  border: 1px solid var(--gold);
  background: var(--parchment-card);
  color: var(--crimson);
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.18em;
  padding: 13px 34px;
  border-radius: var(--radius);
  box-shadow: 0 3px 0 var(--gold-pale);
  cursor: pointer;
  min-height: 50px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-restart .restart-icon { font-size: 15px; color: var(--gold); }
.btn-restart:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--gold-pale);
}
.btn-restart:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

/* 结束挑战：深红底金字，与重新开始区分 */
.btn-quit {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  appearance: none;
  border: 1px solid var(--gold);
  background: linear-gradient(180deg, var(--crimson), var(--crimson-deep));
  color: var(--gold-bright);
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.18em;
  padding: 13px 34px;
  border-radius: var(--radius);
  box-shadow: 0 3px 0 var(--crimson-ink);
  cursor: pointer;
  min-height: 50px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-quit .quit-icon { font-size: 15px; color: var(--gold); }
.btn-quit:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--crimson-ink);
}
.btn-quit:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

/* ============================================================
   八、结果弹窗（游戏内 UI 面板，非浏览器弹窗）
   ============================================================ */
.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(46, 34, 24, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 50;
}
.modal-mask.open { display: flex; }

.modal {
  width: 100%;
  max-width: 340px;
  background: var(--parchment-card);
  border: 2px solid var(--gold);
  border-radius: var(--radius);
  box-shadow: inset 0 0 0 1px rgba(201, 162, 39, 0.35), 0 14px 34px rgba(46, 34, 24, 0.35);
  padding: 30px 24px 26px;
  text-align: center;
  animation: modal-in 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
@keyframes modal-in {
  from { transform: scale(0.86); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

.modal-emblem { font-size: 34px; color: var(--gold); }
.modal-title {
  margin-top: 12px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.1em;
  color: var(--crimson);
}
.modal-desc {
  margin-top: 10px;
  font-size: 14.5px;
  line-height: 1.8;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
}
.modal-stats {
  margin: 16px auto 22px;
  display: inline-flex;
  gap: 26px;
  padding: 10px 20px;
  border: 1px solid var(--gold-pale);
  border-radius: 8px;
  background: var(--parchment);
}
.modal-stats .stat { display: flex; flex-direction: column; gap: 3px; }
.modal-stats .stat-label {
  font-size: 11.5px;
  letter-spacing: 0.12em;
  color: var(--ink-soft);
}
.modal-stats .stat-value {
  font-size: 17px;
  font-weight: 900;
  color: var(--crimson);
  font-variant-numeric: tabular-nums;
}
.btn-restart-lg {
  appearance: none;
  border: 1px solid var(--gold);
  background: linear-gradient(180deg, var(--crimson), var(--crimson-deep));
  color: var(--gold-bright);
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 0.3em;
  text-indent: 0.3em;
  padding: 14px 40px;
  border-radius: var(--radius);
  box-shadow: 0 3px 0 var(--crimson-ink);
  cursor: pointer;
  min-height: 54px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-restart-lg:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--crimson-ink);
}
.btn-restart-lg:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

/* 游戏面板底部署名 */
.game-footer {
  margin-top: auto;
  padding-top: 24px;
  text-align: center;
  font-size: 12.5px;
  letter-spacing: 0.22em;
  color: var(--ink-soft);
  opacity: 0.8;
}

/* 减少动效偏好：关闭脉冲与抖动 */
@media (prefers-reduced-motion: reduce) {
  .card-inner, .card, .modal { transition: none; animation: none; }
  .timer-badge.danger { animation: none; }
}
/* ============================================================
   九、配对消灭表演：卡牌原地金光炸 / 飘字 / 连击 / 提示
   ============================================================ */
#fx-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 40;   /* 低于结算弹窗（50），通关时表演会被弹窗盖住，不会穿帮 */
}
/* 最后一组飞卡时：柔光洗淡棋盘 + 飞出的卡牌复制体 */
.fx-scrim {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: radial-gradient(circle at 50% 40%,
              rgba(251, 246, 234, 0.95) 0%,
              rgba(251, 246, 234, 0.88) 30%,
              rgba(251, 246, 234, 0) 60%);
}
.fx-clone {
  z-index: 1;
  border-radius: var(--radius);
  box-shadow: 0 14px 36px rgba(46, 34, 24, 0.45);
}
.fx-flash {
  position: fixed;
  z-index: 2;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle,
              rgba(255, 255, 255, 0) 28%,
              rgba(255, 236, 170, 0.92) 40%,
              rgba(201, 162, 39, 0.72) 52%,
              rgba(201, 162, 39, 0) 72%);
}
.fx-particle {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: radial-gradient(circle, #FFFFFF 0%, #F5CE63 45%, var(--gold) 100%);
  box-shadow: 0 0 8px rgba(201, 162, 39, 0.95), 0 0 2px rgba(111, 20, 20, 0.5);
}
.fx-text {
  position: fixed;
  z-index: 3;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-family: var(--serif);
  white-space: nowrap;
  text-align: center;
}
/* 深红匾额 + 金字：米黄背景上也清楚，且贴合主题 */
.fx-text b {
  display: inline-block;
  padding: 5px 18px 6px;
  font-size: clamp(17px, 4.4vw, 22px);
  font-weight: 900;
  letter-spacing: 0.2em;
  text-indent: 0.2em;
  color: var(--gold-bright);
  background: linear-gradient(180deg, rgba(138, 28, 28, 0.96), rgba(94, 16, 16, 0.96));
  border: 1px solid rgba(223, 192, 99, 0.85);
  border-radius: 6px;
  box-shadow: inset 0 0 0 1px rgba(94, 16, 16, 0.9), 0 6px 18px rgba(94, 16, 16, 0.35);
}
.fx-text i {
  font-style: normal;
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--crimson-ink);
  background: rgba(255, 243, 201, 0.95);
  border: 1px solid rgba(201, 162, 39, 0.7);
  border-radius: 999px;
  padding: 2px 10px;
}

/* 最后一组：匾额更大更亮，作为通关收尾 */
.fx-text.big b {
  padding: 7px 24px 8px;
  font-size: clamp(21px, 5.6vw, 28px);
  letter-spacing: 0.24em;
  text-indent: 0.24em;
  box-shadow: inset 0 0 0 1px rgba(94, 16, 16, 0.9),
              0 0 0 2px rgba(223, 192, 99, 0.6),
              0 10px 26px rgba(94, 16, 16, 0.45);
}
.fx-text.big i { font-size: 13.5px; }

/* 连击徽标（右上角，>=2 连才出现） */
.streak-badge {
  display: none;
  align-items: center;
  align-self: center;   /* 顶栏是 align-items: stretch，不撑变形 */
  flex: 0 0 auto;
  gap: 4px;
  background: linear-gradient(180deg, var(--gold-bright), var(--gold));
  color: var(--crimson-ink);
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.04em;
  padding: 4px 9px;
  border-radius: 999px;
  box-shadow: 0 2px 6px rgba(201, 162, 39, 0.4);
  white-space: nowrap;
}
.streak-badge.show { display: inline-flex; animation: streak-pop 0.3s ease; }
.streak-badge .star-mark { font-size: 9px; color: var(--crimson); }
@keyframes streak-pop {
  0%   { transform: scale(0.82); }
  60%  { transform: scale(1.07); }
  100% { transform: scale(1); }
}

/* 底部提示条 */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(30px + env(safe-area-inset-bottom));
  transform: translate(-50%, 12px);
  max-width: 84vw;
  background: rgba(46, 34, 24, 0.93);
  color: var(--parchment);
  font-family: var(--serif);
  font-size: 13px;
  letter-spacing: 0.06em;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid rgba(201, 162, 39, 0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 70;
  text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .streak-badge.show { animation: none; }
}

/* 小屏（≤400px）收紧：底部两个按钮原本并排会溢出，连击徽标也压一压 */
@media (max-width: 400px) {
  .btn-restart,
  .btn-quit {
    padding: 12px 16px;
    font-size: 15px;
    letter-spacing: 0.12em;
  }
  .streak-badge { font-size: 10.5px; padding: 3px 7px; }
}

</style>
</head>

      <span class="timer-icon star-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="13" r="8.2"/>
          <path d="M12 8.5V13l3.4 2"/>

      </span>
      <span id="timer-text" class="timer-text">45</span>
      <span class="timer-unit">秒</span>
    </div>

    <div class="topbar-right">
      <div class="progress-badge" aria-live="polite">
        <span>已完成</span>
        <span class="progress-num"><span id="progress-done">0</span>/<b>7</b></span>
      </div>
      <div id="streak-badge" class="streak-badge" aria-hidden="true">
        <span class="star-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.26 6.6.72-4.9 4.56 1.34 6.7L12 16.9l-5.94 3.34 1.34-6.7L2.5 8.98l6.6-.72L12 2z"/></svg></span>
        <span id="streak-num">2</span> 连击
      </div>
      <!-- 音效开关：开启/静音 -->
      <button id="btn-sound" class="btn-sound" type="button" aria-label="音效开关" aria-pressed="true" title="音效开关">
        <span class="sound-on">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M11 5L6 9H3v6h3l5 4V5z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path d="M18.5 6.5a9 9 0 0 1 0 11"/>
          </svg>
        </span>
        <span class="sound-off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M11 5L6 9H3v6h3l5 4V5z"/>
            <path d="M16 9l5 6"/>
            <path d="M21 9l-5 6"/>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <!-- 卡牌网格 -->
  <div id="board" class="board" aria-label="翻牌游戏棋盘"></div>

  <!-- 游戏内操作按钮：重新开始 / 结束挑战 -->
  <div class="game-actions">
    <button id="btn-restart" class="btn-restart" type="button">
      <span class="restart-icon star-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4"/>
        </svg>
      </span>
      重新开始
    </button>
    <button id="btn-quit" class="btn-quit" type="button">
      <span class="quit-icon star-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </span>
      结束挑战
    </button>
  </div>

  <p class="game-footer">游戏制作人：艺管263 黄天佑</p>
</main>

</div>

const FLIP_VARIANTS = ['flip1', 'flip2', 'flip3', 'flip4'];

let audioCtx = null;
let soundMuted = false;
let sfxLoading = null;
const sfxBuffers = {};

/* 获取 / 解锁音频上下文（必须在用户手势内调用） */
function getAudioCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/* 用户手势里调一次，iOS 上才能真正出声 */
function unlockAudio() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
}

function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

function decodeBuffer(ctx, arrayBuffer) {
  return new Promise((resolve, reject) => {
    const maybe = ctx.decodeAudioData(arrayBuffer, resolve, reject);
    if (maybe && typeof maybe.then === 'function') maybe.then(resolve, reject);
  });
}

/* 预解码所有采样；失败不阻塞游戏（最多就是没声音） */
function loadSfx() {
  if (sfxLoading) return sfxLoading;
  const ctx = getAudioCtx();
  if (!ctx) return Promise.resolve();
  sfxLoading = Promise.all(
    Object.keys(SFX_B64).map((key) =>
      decodeBuffer(ctx, b64ToArrayBuffer(SFX_B64[key]))
        .then((buf) => { sfxBuffers[key] = buf; })
        .catch(() => {})
    )
  );
  return sfxLoading;
}

/* 播放一个采样：gain 音量、rate 音高（1 = 原速）、delay 延迟秒 */
function playSfx(name, opts) {
  if (soundMuted) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  const buf = sfxBuffers[name];
  if (!buf) { loadSfx(); return; }
  const o = opts || {};
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = o.rate || 1;
  const g = ctx.createGain();
  g.gain.value = o.gain === undefined ? 1 : o.gain;
  src.connect(g);
  g.connect(ctx.destination);
  src.start(ctx.currentTime + (o.delay || 0));
}

/* 翻牌：4 条变奏随机 + 音高/音量微扰 */
function playFlip() {
  const name = FLIP_VARIANTS[(Math.random() * FLIP_VARIANTS.length) | 0];
  playSfx(name, { gain: 0.62 + Math.random() * 0.16, rate: 0.95 + Math.random() * 0.1 });
}

/* 配对成功：钟琴“叮” */
function playMatch() {
  playSfx('match', { gain: 0.78, rate: 0.99 + Math.random() * 0.02 });
}

/* 通关：成就音 + 观众短暂欢呼 */
function playAchieve() {
  playSfx('achieve', { gain: 0.85 });
}
function playCheer() {
  playSfx('cheer', { gain: 0.72, delay: 0.28 });
}

/* 错配：一记闷响（合成，不需要素材） */
function playMismatch() {
  if (soundMuted) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(200, t);
  osc.frequency.exponentialRampToValueAtTime(96, t + 0.17);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 640;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.11, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
  osc.connect(lp);
  lp.connect(g);
  g.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.26);
}

/* 失败：下行两音（合成） */
function playFail() {
  if (soundMuted) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;
  [392, 262].forEach((f, i) => {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    const g = ctx.createGain();
    const at = t + i * 0.20;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.16, at + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.42);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(at);
    osc.stop(at + 0.45);
  });
}

/* 音效开关：切换静音状态与按钮图标 */
function toggleSound() {
  soundMuted = !soundMuted;
  soundBtn.classList.toggle('muted', soundMuted);
  soundBtn.setAttribute('aria-pressed', String(!soundMuted));
  if (!soundMuted) unlockAudio();
}

/* ---------- 四、工具函数 ---------- */

/* Fisher-Yates 洗牌：返回打乱后的数组 */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 读取最快纪录（隐私模式 / 禁用存储时静默失败） */
function readBest() {
  try { return localStorage.getItem(BEST_KEY) || null; }
  catch (e) { return null; }
}
function saveBest(sec) {
  try {
    const old = readBest();
    if (old === null || sec < Number(old)) localStorage.setItem(BEST_KEY, String(sec));
  } catch (e) { /* 忽略存储失败 */ }
}

/* ---------- 五、视图切换 ---------- */
function showView(name) {
  viewHome.classList.toggle('active', name === 'home');
  viewGame.classList.toggle('active', name === 'game');
}

/* ---------- 六、渲染棋盘 ---------- */
/* 每次配对都配一声成就音（想关掉改成 false，只在全部通关时放） */
const ACHIEVEMENT_EACH_MATCH = true;

const fxLayer = document.getElementById('fx-layer');
const streakBadge = document.getElementById('streak-badge');
const streakNum = document.getElementById('streak-num');
const toastEl = document.getElementById('toast');

function buildDeck() {
  // 每张事件生成两张牌（pairId 相同），再整体洗牌
  const pairs = [];
  CARDS.forEach((c, i) => {
    pairs.push({ id: c.id, pairId: i, name: c.name, img: c.img, matched: false, flipped: false });
    pairs.push({ id: c.id, pairId: i, name: c.name, img: c.img, matched: false, flipped: false });
  });
  state.deck = shuffle(pairs);

  boardEl.innerHTML = '';
  state.deck.forEach((card, idx) => {
    const el = document.createElement('div');
    el.className = 'card' + (card.img ? ' has-img' : '');
    el.dataset.idx = idx;
    // 无障碍：卡牌是按钮，键盘可操作
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', '第 ' + (idx + 1) + ' 张牌，未翻开');
    el.innerHTML = `
      <div class="card-inner">
        <!-- 背面：深红 + 金色纹样 -->
        <div class="card-face card-back">
          <div class="back-content">
            <span class="back-star star-mark">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2l2.9 6.26 6.6.72-4.9 4.56 1.34 6.7L12 16.9l-5.94 3.34 1.34-6.7L2.5 8.98l6.6-.72L12 2z"/>
              </svg>
            </span>
            <span class="back-word">长征</span>
          </div>
        </div>
        <!-- 正面：事件历史画面（3:4 图）+ 底部事件名标签 -->
        <div class="card-face card-front">
          <img class="card-img" src="${card.img || ''}" alt="${card.name}" loading="lazy">
          <div class="front-name-tag">${card.name}</div>
          <div class="front-placeholder">
            <span class="front-star star-mark">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2l2.9 6.26 6.6.72-4.9 4.56 1.34 6.7L12 16.9l-5.94 3.34 1.34-6.7L2.5 8.98l6.6-.72L12 2z"/>
              </svg>
            </span>
            <span class="front-name">${card.name}</span>
            <span class="front-tag">长征记忆</span>
          </div>
        </div>
      </div>`;
    // 兜底：图片解码失败时回退为文字占位，避免卡牌白板
    el.querySelector('.card-img').addEventListener('error', () => {
      el.classList.remove('has-img');
    });
    boardEl.appendChild(el);
  });
}

/* ---------- 七、计时器（rAF 驱动，精确倒计时） ---------- */
function startTimer() {
  stopTimer();
  state.lastTick = performance.now();
  const tick = (now) => {
    if (state.phase !== 'playing') return;
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;
    state.timeLeft -= dt;
    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      updateTimerUI();
      endGame(false);
      return;
    }
    updateTimerUI();
    state.rafId = requestAnimationFrame(tick);
  };
  state.rafId = requestAnimationFrame(tick);
}

function stopTimer() {
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.rafId = null;
}

/* 更新倒计时显示；最后 10 秒进入警示状态 */
function updateTimerUI() {
  const sec = Math.max(0, Math.ceil(state.timeLeft));
  timerText.textContent = sec;
  timerBadge.classList.toggle('danger', sec <= 10 && state.phase === 'playing');
}

/* ---------- 八、翻牌与配对 ----------
   规则：
   1. 点牌即翻开，可连续翻开多张；
   2. 翻到两张相同 → 立即配对成功，触发“消灭表演”，卡牌保持翻开；
   3. 同时最多 2 张翻开，翻开第 3 张时最早翻开的那张自动翻回；
   4. 两张不同 → 立刻抖动 + 闷响，2.2 秒后**两张一起**翻回（不再各翻各的）；
   5. 连续配对成功（2 连及以上）奖励 +1.5 秒，错配清空连击。      */

function flipCard(idx, flipped) {
  const card = state.deck[idx];
  if (!card) return;
  card.flipped = flipped;
  const el = boardEl.children[idx];
  if (el) {
    el.classList.toggle('flipped', flipped);
    el.setAttribute('aria-label', '第 ' + (idx + 1) + ' 张牌，' + (flipped ? '已翻开' : '未翻开'));
  }
  if (flipped) playFlip();   // 翻开时播放真实翻牌采样
}

function onCardClick(idx) {
  if (state.phase !== 'playing') return;
  const card = state.deck[idx];
  if (!card || card.matched || card.flipped) return;
  state.lastActionAt = performance.now();

  flipCard(idx, true);
  state.flippedQueue.push(idx);

  // 先判配对：这样“翻开第 3 张时正好配上前两张之一”也能成立，
  // 不会因为先挤掉最早那张而白白丢掉一次配对机会。
  const partnerIdx = state.flippedQueue.findIndex(
    (i) => i !== idx && state.deck[i].pairId === card.pairId
  );
  if (partnerIdx !== -1) {
    resolveMatch(idx, state.flippedQueue[partnerIdx]);
    return;
  }

  // 没配上：超过同时翻开上限时，最早翻开的那张翻回
  while (state.flippedQueue.length > MAX_FLIPPED) {
    const oldest = state.flippedQueue.shift();
    cancelMismatchTimer();
    flipCard(oldest, false);
  }

  // 两张不同 → 闷响一声，2.2 秒后一起翻回（不抖屏）
  if (state.flippedQueue.length >= 2) {
    state.streak = 0;
    updateStreakUI();
    playMismatch();
    scheduleMismatchClose();
  }
}

function scheduleMismatchClose() {
  cancelMismatchTimer();
  state.mismatchTimer = setTimeout(() => {
    state.mismatchTimer = null;
    state.flippedQueue.slice().forEach((i) => {
      const c = state.deck[i];
      if (c && c.flipped && !c.matched) flipCard(i, false);
    });
    state.flippedQueue = [];
  }, MISMATCH_HOLD_MS);
}

function cancelMismatchTimer() {
  if (state.mismatchTimer) {
    clearTimeout(state.mismatchTimer);
    state.mismatchTimer = null;
  }
}

function resolveMatch(idx, aIdx) {
  cancelMismatchTimer();
  const card = state.deck[idx];
  state.deck[idx].matched = true;
  state.deck[aIdx].matched = true;
  state.matchedCount += 1;
  state.streak += 1;
  state.flippedQueue = state.flippedQueue.filter((i) => i !== idx && i !== aIdx);
  progressEl.textContent = state.matchedCount;
  updateStreakUI();

  // 规则 5：连击奖励
  let bonus = 0;
  if (state.streak >= 2) {
    bonus = Math.min(COMBO_BONUS_S, Math.max(0, TIME_LIMIT - state.timeLeft));
    if (bonus > 0) state.timeLeft += bonus;
  }

  const isFinal = state.matchedCount === TOTAL_PAIRS;

  playMatch();
  if (ACHIEVEMENT_EACH_MATCH) playAchieve();   // 每次配对都配一声成就音
  // 普通配对：原地闪；最后一组：飞到中间撞一下
  if (isFinal) finalFlightFx(idx, aIdx, card.name, bonus);
  else playMatchFx(idx, aIdx, card.name, bonus);

  // 队列里若还有别的翻开的牌（连续翻 3 张的情况），稍后自动翻回，避免一直白看着
  if (state.flippedQueue.length) scheduleMismatchClose();

  if (isFinal) {
    state.phase = 'ending';
    stopTimer();
    // 等飞行、碰撞、停留展示、飞回全部走完再弹结算
    setTimeout(() => endGame(true), 1800);
  }
}

/* ---------- 九、“配对 = 消灭”表演 ----------
   普通配对：卡牌留在原地，两张同时金光炸开 + 飘出卡名。
   最后一组：两张卡飞到屏幕中间**撞一下**再炸，作为通关的收尾重音。   */
function resetFx() {
  if (fxLayer) fxLayer.innerHTML = '';
}

function cardBox(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, r };
}

/* 一圈金光：从中心放大淡出 */
function blastAt(p, size, life) {
  if (!fxLayer) return;
  const f = document.createElement('div');
  f.className = 'fx-flash';
  f.style.width = size + 'px';
  f.style.height = size + 'px';
  f.style.left = p.x + 'px';
  f.style.top = p.y + 'px';
  fxLayer.appendChild(f);
  if (f.animate) {
    f.animate(
      [{ transform: 'translate(-50%,-50%) scale(.45)', opacity: 0.95 },
       { transform: 'translate(-50%,-50%) scale(1.25)', opacity: 0 }],
      { duration: life, easing: 'ease-out', fill: 'forwards' }
    );
  }
  setTimeout(() => f.remove(), life + 40);
}

/* 粒子：从一点向外飞散 */
function sparksAt(p, count, spread, life) {
  if (!fxLayer) return;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.className = 'fx-particle';
    s.style.left = p.x + 'px';
    s.style.top = p.y + 'px';
    fxLayer.appendChild(s);
    const ang = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = spread * (0.55 + Math.random() * 0.75);
    const dur = life * (0.75 + Math.random() * 0.5);
    if (s.animate) {
      s.animate(
        [{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
         { transform: 'translate(calc(-50% + ' + (Math.cos(ang) * dist).toFixed(1) + 'px), calc(-50% + ' +
                      (Math.sin(ang) * dist).toFixed(1) + 'px)) scale(.15)', opacity: 0 }],
        { duration: dur, easing: 'cubic-bezier(.1,.7,.3,1)', fill: 'forwards' }
      );
    }
    setTimeout(() => s.remove(), dur + 40);
  }
}

/* 飘字：淡入 → 稳稳停留 → 上浮淡出；贴边时自动夹进视口 */
function showFxText(name, bonus, x, y, big, durMs) {
  if (!fxLayer) return;
  const t = document.createElement('div');
  t.className = 'fx-text' + (big ? ' big' : '');
  t.innerHTML = '<b>' + name + '</b>' + (bonus > 0 ? '<i>连击 +' + bonus.toFixed(1) + ' 秒</i>' : '');
  t.style.left = x + 'px';
  t.style.top = y + 'px';
  fxLayer.appendChild(t);

  const halfW = t.offsetWidth / 2;
  const halfH = t.offsetHeight / 2;
  const pad = 10;
  const nx = Math.min(Math.max(x, halfW + pad), window.innerWidth - halfW - pad);
  const ny = Math.min(Math.max(y, halfH + pad), window.innerHeight - halfH - pad);
  if (nx !== x) t.style.left = nx + 'px';
  if (ny !== y) t.style.top = ny + 'px';

  const dur = durMs || (big ? 1050 : 950);
  if (t.animate) {
    t.animate(
      [{ transform: 'translate(-50%,-50%) translateY(8px)', opacity: 0 },
       { transform: 'translate(-50%,-50%) translateY(0px)', opacity: 1, offset: 0.14 },
       { transform: 'translate(-50%,-50%) translateY(-2px)', opacity: 1, offset: 0.68 },
       { transform: 'translate(-50%,-50%) translateY(-12px)', opacity: 0 }],
      { duration: dur, easing: 'ease-out', fill: 'forwards' }
    );
  }
  setTimeout(() => t.remove(), dur + 40);
}

/* ============ 普通配对：原地炸 ============ */
function playMatchFx(idxA, idxB, name, bonus) {
  const elA = boardEl.children[idxA];
  const elB = boardEl.children[idxB];
  if (!elA || !elB) return;
  elA.classList.add('matched');
  elB.classList.add('matched');
  if (!fxLayer) return;

  const a = cardBox(elA);
  const b = cardBox(elB);

  // 卡面本身提亮一下（原地，不位移）
  [elA, elB].forEach((el) => {
    if (!el.animate) return;
    el.animate(
      [
        { filter: 'brightness(1) saturate(1)', boxShadow: '0 0 0 0 rgba(223,192,99,0)' },
        { filter: 'brightness(1.5) saturate(1.15)', boxShadow: '0 0 26px 7px rgba(223,192,99,0.8)', offset: 0.16 },
        { filter: 'brightness(1) saturate(1)', boxShadow: '0 0 0 0 rgba(223,192,99,0)' }
      ],
      { duration: 480, easing: 'ease-out' }
    );
  });

  const size = Math.max(a.w, b.w) * 1.75;
  blastAt(a, size, 420);
  blastAt(b, size, 420);
  sparksAt(a, 7, a.w * 0.6, 560);
  sparksAt(b, 7, b.w * 0.6, 560);

  // 匾额优先放在两张卡下方；下面没空间放上方；都放不下退回中间，且始终夹在棋盘内
  const br = boardEl.getBoundingClientRect();
  const cx = (a.x + b.x) / 2;
  const topY = Math.min(a.y - a.h / 2, b.y - b.h / 2);
  const bottomY = Math.max(a.y + a.h / 2, b.y + b.h / 2);
  const gapY = 26;
  let ty;
  if (bottomY + gapY + 26 <= br.bottom) ty = bottomY + gapY;
  else if (topY - gapY - 26 >= br.top) ty = topY - gapY;
  else ty = (topY + bottomY) / 2;
  ty = Math.min(Math.max(ty, br.top + 26), br.bottom - 26);
  showFxText(name, bonus, cx, ty, false);
}

/* ============ 最后一组：飞到中间碰撞 ============ */
function finalFlightFx(idxA, idxB, name, bonus) {
  const elA = boardEl.children[idxA];
  const elB = boardEl.children[idxB];
  if (!elA || !elB) return;
  elA.classList.add('matched');
  elB.classList.add('matched');
  if (!fxLayer || typeof elA.animate !== 'function') return;

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  // 柔光：把棋盘洗淡，飞出的两张才是主角
  const scrim = document.createElement('div');
  scrim.className = 'fx-scrim';
  fxLayer.appendChild(scrim);
  if (scrim.animate) {
    scrim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out', fill: 'forwards' });
  }

  const mkClone = (el) => {
    const r = el.getBoundingClientRect();
    const c = el.cloneNode(true);
    c.classList.add('fx-clone');
    c.removeAttribute('data-idx');
    c.removeAttribute('role');
    c.removeAttribute('tabindex');
    c.removeAttribute('aria-label');
    c.style.position = 'fixed';
    c.style.left = r.left + 'px';
    c.style.top = r.top + 'px';
    c.style.width = r.width + 'px';
    c.style.height = r.height + 'px';
    c.style.margin = '0';
    fxLayer.appendChild(c);
    return { node: c, rect: r };
  };

  const A = mkClone(elA);
  const B = mkClone(elB);
  elA.style.visibility = 'hidden';
  elB.style.visibility = 'hidden';

  const gap = Math.max(6, A.rect.width * 0.07);
  const scale = Math.min(1, (vw * 0.58) / (A.rect.width * 2 + gap));
  const tw = A.rect.width * scale;
  const cx = vw / 2;
  const cy = vh * 0.40;
  const bump = 12;        // 相撞时向内挤的距离

  // 时间轴（毫秒）
  const FLY = 480;        // 飞入（渐快渐慢 + 到位回弹）
  const HIT = 90;         // 撞上的挤压
  const REL = 170;        // 弹回
  const HOLD = 650;       // 停在中间展示
  const BACK = 320;       // 飞回原位

  const place = (o, dir) => {
    const centerX = dir < 0 ? cx - gap / 2 - tw / 2 : cx + gap / 2 + tw / 2;
    return {
      dx: centerX - (o.rect.left + o.rect.width / 2),
      dy: cy - (o.rect.top + o.rect.height / 2),
      rot: dir * -8
    };
  };
  const tx = (p, ex) => 'translate(' + (p.dx + ex) + 'px, ' + p.dy + 'px)';
  const tf = (p, ex, s) => tx(p, ex) + ' rotate(' + p.rot + 'deg) scale(' + (s == null ? scale : s) + ')';
  const tfXY = (p, ex, sx, sy) => tx(p, ex) + ' rotate(' + p.rot + 'deg) scale(' + sx + ',' + sy + ')';
  const home = 'translate(0px, 0px) rotate(0deg) scale(1)';

  const pA = place(A, -1);
  const pB = place(B, 1);

  /* 飞入：四段位移比例 —— 慢起、中段冲刺、略微冲过头、再落回原位 */
  const FLY_STEPS = [
    { t: 0.00, e: 0.000, r: 0.00, s: 1.000 },
    { t: 0.12, e: 0.035, r: 0.28, s: 1.012 },
    { t: 0.55, e: 0.760, r: 1.18, s: 1.030 },
    { t: 0.82, e: 1.045, r: 0.93, s: 0.992 },
    { t: 1.00, e: 1.000, r: 1.00, s: 1.000 }
  ];

  const flyIn = (o, p) => {
    const frames = FLY_STEPS.map((st) => ({
      offset: st.t,
      transform: 'translate(' + (p.dx * st.e).toFixed(1) + 'px, ' + (p.dy * st.e).toFixed(1) + 'px) ' +
                 'rotate(' + (p.rot * st.r).toFixed(1) + 'deg) scale(' + (scale * st.s).toFixed(3) + ')',
      easing: 'cubic-bezier(.36,0,.34,1)'
    }));
    return o.node.animate(frames, { duration: FLY, easing: 'linear', fill: 'forwards' });
  };

  /* 撞上：向内挤 + 横向压扁（scaleX 变小 / scaleY 略撑高） */
  const squeeze = (o, p, dir) => o.node.animate(
    [{ transform: tf(p, 0) },
     { transform: tfXY(p, dir * -bump, scale * 0.92, scale * 1.05) }],
    { duration: HIT, easing: 'cubic-bezier(.3,.9,.5,1)', fill: 'forwards' }
  );

  /* 弹回：带一点回弹感的缓出 */
  const release = (o, p) => o.node.animate(
    [{ transform: tfXY(p, 0, scale * 0.92, scale * 1.05) },
     { transform: tf(p, 0, scale * 1.02) },
     { transform: tf(p, 0) }],
    { duration: REL, easing: 'cubic-bezier(.2,1.4,.45,1)', fill: 'forwards' }
  );

  /* 停留：极轻微的呼吸感，让画面不死 */
  const breathe = (o, p) => o.node.animate(
    [{ transform: tf(p, 0), offset: 0 },
     { transform: tf(p, 0, scale * 1.016), offset: 0.5 },
     { transform: tf(p, 0), offset: 1 }],
    { duration: HOLD, easing: 'ease-in-out', fill: 'forwards' }
  );

  /* 飞回：渐慢收进原位 */
  const flyBack = (o, p) => o.node.animate(
    [{ transform: tf(p, 0), opacity: 1 },
     { transform: home, opacity: 0.08 }],
    { duration: BACK, easing: 'cubic-bezier(.45,0,.55,1)', fill: 'forwards' }
  );

  const flashClones = () => {
    [A, B].forEach((o) => {
      if (!o.node.animate) return;
      o.node.animate(
        [{ filter: 'brightness(1) saturate(1)' },
         { filter: 'brightness(1.75) saturate(1.25)', offset: 0.16 },
         { filter: 'brightness(1) saturate(1)' }],
        { duration: 420, easing: 'ease-out' }
      );
    });
  };

  let cleaned = false;
  const finish = () => {
    if (cleaned) return;
    cleaned = true;
    A.node.remove();
    B.node.remove();
    scrim.remove();
    elA.style.visibility = '';
    elB.style.visibility = '';
  };
  const fadeScrim = () => {
    if (!scrim.animate) { scrim.remove(); return; }
    scrim.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: 'ease-in', fill: 'forwards' });
    setTimeout(() => scrim.remove(), 300);
  };

  flyIn(A, pA);
  flyIn(B, pB);

  const T_HIT = FLY;
  const T_BURST = FLY + HIT;
  const T_HOLD = T_BURST + REL;
  const T_BACK = T_HOLD + HOLD;
  const T_DONE = T_BACK + BACK + 40;

  setTimeout(() => { squeeze(A, pA, -1); squeeze(B, pB, 1); }, T_HIT);
  setTimeout(() => {
    release(A, pA);
    release(B, pB);
    flashClones();
    blastAt({ x: cx, y: cy }, Math.max(A.rect.width, B.rect.width) * 2.7, 580);
    sparksAt({ x: cx, y: cy }, 14, A.rect.width * 0.95, 660);
    showFxText(name, bonus, cx, cy + A.rect.height * 0.5 + 42, true, 1180);
  }, T_BURST);
  setTimeout(() => { breathe(A, pA); breathe(B, pB); }, T_HOLD);
  setTimeout(() => { flyBack(A, pA); flyBack(B, pB); }, T_BACK);
  setTimeout(fadeScrim, T_BACK - 60);
  setTimeout(finish, T_DONE);
}

/* ---------- 十、连击 / 提示 ---------- */
function updateStreakUI() {
  if (!streakBadge) return;
  const show = state.streak >= 2;
  streakBadge.classList.toggle('show', show);
  if (streakNum) streakNum.textContent = state.streak;
}

let toastTimer = null;
function toast(msg) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

/* ---------- 十一、开局 / 重置 / 结束 ---------- */
function startGame() {
  stopTimer();
  clearAllTimers();
  resetFx();
  unlockAudio();
  loadSfx();

  state.matchedCount = 0;
  state.streak = 0;
  state.flippedQueue = [];
  state.timeLeft = TIME_LIMIT;
  state.startAt = performance.now();
  state.pausedMs = 0;
  state.pausedAt = 0;
  state.lastActionAt = performance.now();
  state.phase = 'playing';

  buildDeck();
  updateStreakUI();
  progressEl.textContent = 0;
  timerBadge.classList.remove('danger');
  updateTimerUI();
  showView('game');
  closeModal();
  startTimer();
}

function clearAllTimers() {
  cancelMismatchTimer();
}

function quitToHome() {
  stopTimer();
  clearAllTimers();
  resetFx();
  state.flippedQueue = [];
  closeModal();
  showView('home');
  state.phase = 'home';
  state.streak = 0;
  updateStreakUI();
}

/* 结束一局：win = 通关，lose = 超时 */
function endGame(win) {
  stopTimer();
  clearAllTimers();
  // 用时不含切后台的暂停时长
  const raw = (performance.now() - state.startAt - state.pausedMs) / 1000;
  state.phase = win ? 'win' : 'lose';

  if (win) {
    const used = Math.max(1, Math.round(raw));
    saveBest(used);
    // 每次配对已经响过成就音了，结算就只叠欢呼，避免 1 秒内重复听到同一句
    if (!ACHIEVEMENT_EACH_MATCH) playAchieve();
    playCheer();
    modalTitle.textContent = '闯关完成';
    modalDesc.innerHTML = '长征历史画卷已全部复原。<br>可以前往集章啦。';
    statTime.textContent = used + ' 秒';
  } else {
    playFail();
    const left = TOTAL_PAIRS - state.matchedCount;
    modalTitle.textContent = '记忆未能复原';
    modalDesc.innerHTML = '时间到了，画卷还差 <b>' + left + '</b> 组未复原。<br>重整旗鼓，再来一局吧。';
    statTime.textContent = '--';
  }

  const best = readBest();
  statBest.textContent = best ? best + ' 秒' : '暂无';
  modalMask.classList.add('open');
  modalMask.setAttribute('aria-hidden', 'false');
}

function closeModal() {
  modalMask.classList.remove('open');
  modalMask.setAttribute('aria-hidden', 'true');
}

/* ---------- 十二、事件绑定 ---------- */

// 卡牌点击（Pointer Events 同时兼容鼠标与触屏）
boardEl.addEventListener('click', (e) => {
  const cardEl = e.target.closest('.card');
  if (!cardEl || !boardEl.contains(cardEl)) return;
  onCardClick(Number(cardEl.dataset.idx));
});

// 键盘操作：Tab 定位到卡牌，Enter / Space 翻开
boardEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
  const cardEl = e.target.closest('.card');
  if (!cardEl) return;
  e.preventDefault();
  onCardClick(Number(cardEl.dataset.idx));
});

// 首页开始游戏
$('#btn-start').addEventListener('click', startGame);

// 游戏内重新开始：已有进度时二次确认，防误触
$('#btn-restart').addEventListener('click', () => {
  if (state.phase === 'playing' && state.matchedCount > 0) {
    if (!window.confirm('重新开始会清空本局进度，确定吗？')) return;
  }
  startGame();
});

// 游戏内结束挑战：返回首页
$('#btn-quit').addEventListener('click', quitToHome);

// 音效开关
soundBtn.addEventListener('click', toggleSound);

// 弹窗重新挑战
$('#btn-again').addEventListener('click', startGame);

// 弹窗遮罩点击关闭（仅通关后允许关闭查看，超时失败也可关闭）
modalMask.addEventListener('click', (e) => {
  if (e.target === modalMask) closeModal();
});

// 首次交互解锁音频（iOS 必须）
document.addEventListener('pointerdown', function once() {
  unlockAudio();
  loadSfx();
  document.removeEventListener('pointerdown', once);
}, { passive: true });

/* ---------- 十三、切后台自动暂停计时 ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (state.phase === 'playing') {
      state.pausedAt = performance.now();
      stopTimer();
      state.phase = 'paused';
    }
  } else if (state.phase === 'paused') {
    state.pausedMs += performance.now() - (state.pausedAt || performance.now());
    state.pausedAt = 0;
    state.phase = 'playing';
    state.lastActionAt = performance.now();
    startTimer();
    updateTimerUI();
  }
});

/* ---------- 十四、长时间无操作自动回首页（展会现场防占位） ---------- */
setInterval(() => {
  if (state.phase !== 'playing') return;
  if (performance.now() - state.lastActionAt > IDLE_MS) {
    quitToHome();
    toast('长时间无操作，已返回首页');
  }
}, 5000);

</script>
