<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8A1C1C">
<title>长征事件限时翻牌 · 纪念长征胜利 90 周年</title>

<!-- ============================================================
  字体：庄重衬线（宋体系统 fallback），走自托管镜像，不依赖外网 Google
  ============================================================ -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap">

<style>
/* ============================================================
   一、设计令牌（Design Tokens）—— 红色国风色板
   主色：深红 / 米黄 / 金色，庄重肃穆，禁止卡通低幼风格
   ============================================================ */
:root {
  --crimson:        #8A1C1C;   /* 主深红：卡牌背面 / 按钮 */
  --crimson-deep:   #6F1414;   /* 深红加深：按压 / 边框 */
  --crimson-ink:    #5E1010;   /* 最深的红，用于阴影 */
  --gold:           #C9A227;   /* 主金：装饰线 / 强调 */
  --gold-bright:    #DFC063;   /* 亮金：配对成功高亮 */
  --gold-pale:      #EAD9A8;   /* 浅金：细纹描边 */
  --parchment:      #F6EFDF;   /* 浅米黄：页面背景 */
  --parchment-card: #FBF6EA;   /* 米黄更浅：卡牌正面底 */
  --ink:            #2E2218;   /* 墨色：正文文字 */
  --ink-soft:       #5C4B38;   /* 次级墨色 */
  --danger:         #C82A20;   /* 警示红：倒计时最后阶段 */
  --radius:         10px;      /* 克制的圆角，国风不花哨 */
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
}

body {
  font-family: var(--serif);
  background: var(--parchment);
  color: var(--ink);
  /* 背景：浅米黄纸面 + 极淡的红色底纹，营造宣纸质感 */
  background-image:
    radial-gradient(circle at 18% 12%, rgba(138, 28, 28, 0.045) 0, transparent 34%),
    radial-gradient(circle at 85% 88%, rgba(201, 162, 39, 0.06) 0, transparent 38%);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overflow-x: hidden;
}

/* ============================================================
   二、通用装饰元素
   五角星（SVG 内联描边）与金色饰线，构成国风签名元素
   ============================================================ */
.star-mark {
  display: inline-flex;
  color: var(--gold);
}
.star-mark svg {
  width: 1em;
  height: 1em;
}

.gold-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--gold);
  margin: 0 auto;
  max-width: 260px;
}
.gold-rule::before,
.gold-rule::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
}
.gold-rule .star-mark { font-size: 14px; }

/* ============================================================
   三、视图容器
   ============================================================ */
.view {
  display: none;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  padding:
    calc(18px + env(safe-area-inset-top))
    18px
    calc(18px + env(safe-area-inset-bottom));
  flex-direction: column;
}
.view.active { display: flex; }

/* ============================================================
   四、首页
   ============================================================ */
.home-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 22px;
}

.home-emblem { font-size: 40px; }

.home-title {
  font-size: clamp(30px, 8.5vw, 46px);
  font-weight: 900;
  letter-spacing: 0.12em;
  color: var(--crimson);
  line-height: 1.3;
}

.home-subtitle {
  font-size: clamp(15px, 4vw, 18px);
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--gold);
  margin-top: -12px;
}

.home-subtitle-2 {
  font-size: clamp(13px, 3.6vw, 16px);
  font-weight: 600;
  letter-spacing: 0.26em;
  color: var(--crimson);
  margin-top: -8px;
  opacity: 0.92;
}

.home-intro {
  font-size: clamp(14px, 3.8vw, 16px);
  line-height: 1.9;
  color: var(--ink-soft);
  max-width: 420px;
  letter-spacing: 0.04em;
}

.home-intro strong { color: var(--crimson); font-weight: 700; }

/* 开始游戏按钮：深红底金字，大触控区 */
.btn-primary {
  appearance: none;
  border: 1px solid var(--gold);
  background: linear-gradient(180deg, var(--crimson), var(--crimson-deep));
  color: var(--gold-bright);
  font-family: var(--serif);
  font-size: clamp(18px, 5vw, 22px);
  font-weight: 900;
  letter-spacing: 0.35em;
  text-indent: 0.35em; /* 平衡字距带来的视觉偏移 */
  padding: 16px 46px;
  border-radius: var(--radius);
  box-shadow: 0 4px 0 var(--crimson-ink), 0 8px 18px rgba(94, 16, 16, 0.25);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  min-height: 56px;
}
.btn-primary:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--crimson-ink), 0 4px 10px rgba(94, 16, 16, 0.2);
}
.btn-primary:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

/* 制作人署名（首页底部） */
.credit {
  margin-top: 34px;
  font-size: 13px;
  letter-spacing: 0.22em;
  color: var(--ink-soft);
  opacity: 0.85;
}

/* ============================================================
   五、游戏面板
   ============================================================ */
.game-topbar {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

/* 倒计时徽章：左上角，数字醒目 */
.timer-badge {
  display: flex;
  align-items: center;
  gap: 9px;
  background: linear-gradient(180deg, var(--crimson), var(--crimson-deep));
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  padding: 8px 16px;
  box-shadow: 0 3px 0 var(--crimson-ink);
  color: var(--gold-bright);
  font-weight: 700;
  letter-spacing: 0.08em;
}
.timer-badge .timer-icon { font-size: 17px; color: var(--gold); }
.timer-badge .timer-text {
  font-size: 27px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  min-width: 1.6em;
  text-align: center;
}
.timer-badge .timer-unit { font-size: 12px; opacity: 0.85; }

/* 倒计时最后 10 秒的视觉警示：红字 + 脉冲 */
.timer-badge.danger {
  background: linear-gradient(180deg, var(--danger), #A31F16);
  animation: timer-pulse 0.8s ease-in-out infinite;
}
.timer-badge.danger .timer-text,
.timer-badge.danger .timer-unit { color: #FFF3E0; }
.timer-badge.danger .timer-icon { color: #FFE7A3; }

@keyframes timer-pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}

/* 进度徽章：右上角显示已完成组数 */
.progress-badge {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  padding: 8px 14px;
  background: var(--parchment-card);
  border: 1px solid var(--gold-pale);
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 13px;
  letter-spacing: 0.08em;
}
.progress-badge .progress-num {
  font-size: 22px;
  font-weight: 900;
  color: var(--crimson);
  font-variant-numeric: tabular-nums;
}
.progress-badge .progress-num b { color: var(--ink-soft); font-weight: 700; }

/* ============================================================
   六、卡牌网格
   移动端 4 列自适应；宽屏（≥640px）7 列 × 2 行
   ============================================================ */
.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(9px, 2.6vw, 14px);
  width: 100%;
  margin: 0 auto;
}

@media (min-width: 640px) {
  .board { grid-template-columns: repeat(7, 1fr); }
}

/* ---------- 卡牌本体（3D 翻转容器） ---------- */
.card {
  position: relative;
  aspect-ratio: 0.82;           /* 竖版卡牌，接近黄金比例 */
  perspective: 800px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.card.done { cursor: default; }

.card-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0.1, 0.2, 1);
}
.card.flipped .card-inner { transform: rotateY(180deg); }

/* 卡面通用：背面与正面共享定位 */
.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ---------- 卡牌背面：深红 + 金色双线框 + 金五角星 ---------- */
.card-back {
  background: linear-gradient(160deg, var(--crimson) 0%, var(--crimson-deep) 100%);
  border: 2px solid var(--gold);
  box-shadow: inset 0 0 0 1px rgba(223, 192, 99, 0.55), inset 0 0 0 5px var(--crimson-deep), 0 2px 6px rgba(94, 16, 16, 0.28);
}
/* 四角金色角饰（回纹变体，用两层伪元素拼 L 形角标） */
.card-back::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(223, 192, 99, 0.85);
  border-radius: 6px;
  pointer-events: none;
}
.card-back::after {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid rgba(223, 192, 99, 0.35);
  border-radius: 4px;
  pointer-events: none;
}

.card-back .back-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  color: var(--gold-bright);
}
.back-star { font-size: clamp(26px, 7vw, 34px); }
.back-star svg { width: 1em; height: 1em; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35)); }
.back-word {
  font-size: clamp(11px, 3vw, 14px);
  font-weight: 700;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  opacity: 0.92;
}

/* ---------- 卡牌正面：米黄 + 金色细框 + 事件名（占位图位） ---------- */
.card-front {
  background: var(--parchment-card);
  border: 1px solid var(--gold-pale);
  transform: rotateY(180deg);
  box-shadow: inset 0 0 0 1px var(--parchment-card), inset 0 0 0 4px rgba(201, 162, 39, 0.16);
  padding: 6px;
}

/* 事件占位：默认显示事件名；填入图片后由图片覆盖（见下） */
.front-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 6px;
}
.front-placeholder .front-star {
  font-size: clamp(13px, 3.4vw, 17px);
  color: var(--gold);
}
.front-placeholder .front-name {
  font-size: clamp(13px, 3.6vw, 16px);
  font-weight: 900;
  letter-spacing: 0.1em;
  color: var(--crimson);
  text-align: center;
  line-height: 1.35;
  writing-mode: horizontal-tb;
}
.front-placeholder .front-tag {
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--ink-soft);
  opacity: 0.7;
}

/* ---------- 真实插图位（预留替换点） ----------
   替换方法：在下方 JS 的 CARDS 配置中，为每个事件填入 AI 生成的图片 URL，
   例如 { name: "遵义会议", img: "https://..." }。
   填入后本图片会自动覆盖占位文字，无需改动其它代码。
--------------------------------------------------- */
.card-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: calc(var(--radius) - 2px);
  display: none;
}
.card.has-img .card-img { display: block; }
.card.has-img .front-placeholder { display: none; }

/* ---------- 配对成功的正面状态：金色高亮描边 ---------- */
.card.matched .card-front {
  border-color: var(--gold);
  box-shadow: inset 0 0 0 1px var(--gold-bright), 0 0 0 3px rgba(223, 192, 99, 0.55), 0 0 14px rgba(201, 162, 39, 0.45);
}
.card.matched .card-back { border-color: var(--gold-bright); }
.card.matched { animation: match-pop 0.5s ease; }

@keyframes match-pop {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.07); }
  100% { transform: scale(1); }
}

/* ============================================================
   七、游戏内操作按钮：重新开始 / 结束挑战
   ============================================================ */
.game-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}

.btn-restart {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  appearance: none;
  border: 1px solid var(--gold);
  background: var(--parchment-card);
  color: var(--crimson);
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.18em;
  padding: 13px 34px;
  border-radius: var(--radius);
  box-shadow: 0 3px 0 var(--gold-pale);
  cursor: pointer;
  min-height: 50px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-restart .restart-icon { font-size: 15px; color: var(--gold); }
.btn-restart:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--gold-pale);
}
.btn-restart:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

/* 结束挑战：深红底金字，与重新开始区分 */
.btn-quit {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  appearance: none;
  border: 1px solid var(--gold);
  background: linear-gradient(180deg, var(--crimson), var(--crimson-deep));
  color: var(--gold-bright);
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.18em;
  padding: 13px 34px;
  border-radius: var(--radius);
  box-shadow: 0 3px 0 var(--crimson-ink);
  cursor: pointer;
  min-height: 50px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-quit .quit-icon { font-size: 15px; color: var(--gold); }
.btn-quit:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--crimson-ink);
}
.btn-quit:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

/* ============================================================
   八、结果弹窗（游戏内 UI 面板，非浏览器弹窗）
   ============================================================ */
.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(46, 34, 24, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 50;
}
.modal-mask.open { display: flex; }

.modal {
  width: 100%;
  max-width: 340px;
  background: var(--parchment-card);
  border: 2px solid var(--gold);
  border-radius: var(--radius);
  box-shadow: inset 0 0 0 1px rgba(201, 162, 39, 0.35), 0 14px 34px rgba(46, 34, 24, 0.35);
  padding: 30px 24px 26px;
  text-align: center;
  animation: modal-in 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
@keyframes modal-in {
  from { transform: scale(0.86); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

.modal-emblem { font-size: 34px; color: var(--gold); }
.modal-title {
  margin-top: 12px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 0.1em;
  color: var(--crimson);
}
.modal-desc {
  margin-top: 10px;
  font-size: 14.5px;
  line-height: 1.8;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
}
.modal-stats {
  margin: 16px auto 22px;
  display: inline-flex;
  gap: 26px;
  padding: 10px 20px;
  border: 1px solid var(--gold-pale);
  border-radius: 8px;
  background: var(--parchment);
}
.modal-stats .stat { display: flex; flex-direction: column; gap: 3px; }
.modal-stats .stat-label {
  font-size: 11.5px;
  letter-spacing: 0.12em;
  color: var(--ink-soft);
}
.modal-stats .stat-value {
  font-size: 17px;
  font-weight: 900;
  color: var(--crimson);
  font-variant-numeric: tabular-nums;
}
.btn-restart-lg {
  appearance: none;
  border: 1px solid var(--gold);
  background: linear-gradient(180deg, var(--crimson), var(--crimson-deep));
  color: var(--gold-bright);
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 0.3em;
  text-indent: 0.3em;
  padding: 14px 40px;
  border-radius: var(--radius);
  box-shadow: 0 3px 0 var(--crimson-ink);
  cursor: pointer;
  min-height: 54px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-restart-lg:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--crimson-ink);
}
.btn-restart-lg:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

/* 游戏面板底部署名 */
.game-footer {
  margin-top: auto;
  padding-top: 24px;
  text-align: center;
  font-size: 12.5px;
  letter-spacing: 0.22em;
  color: var(--ink-soft);
  opacity: 0.8;
}

/* 减少动效偏好：关闭脉冲与抖动 */
@media (prefers-reduced-motion: reduce) {
  .card-inner, .card, .modal { transition: none; animation: none; }
  .timer-badge.danger { animation: none; }
}
</style>
</head>

<body>

<!-- ============================================================
     视图一：首页
     ============================================================ -->
<main id="view-home" class="view active">
  <div class="home-wrap">
    <div class="home-emblem star-mark">
      <!-- 五角星（国风签名元素） -->
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2l2.9 6.26 6.6.72-4.9 4.56 1.34 6.7L12 16.9l-5.94 3.34 1.34-6.7L2.5 8.98l6.6-.72L12 2z"/>
      </svg>
    </div>

    <div class="gold-rule"><span class="star-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.26 6.6.72-4.9 4.56 1.34 6.7L12 16.9l-5.94 3.34 1.34-6.7L2.5 8.98l6.6-.72L12 2z"/></svg></span></div>

    <h1 class="home-title">长征事件限时翻牌</h1>

    <p class="home-subtitle">纪念长征胜利 90 周年</p>
    <p class="home-subtitle-2">星海音乐学院校友返校周小游戏</p>

    <p class="home-intro">
      翻开卡牌，匹配相同的<strong>长征历史画面</strong>。<br>
      在规定时间内完成挑战，即可<strong>闯关集章</strong>。
    </p>

    <button id="btn-start" class="btn-primary" type="button">开始游戏</button>

    <p class="credit">游戏制作人：艺管263 黄天佑</p>
  </div>
</main>

<!-- ============================================================
     视图二：游戏面板
     ============================================================ -->
<main id="view-game" class="view">
  <!-- 顶栏：左上倒计时 / 右上已完成组数 -->
  <div class="game-topbar">
    <div id="timer-badge" class="timer-badge" aria-live="off">
      <span class="timer-icon star-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="13" r="8.2"/>
          <path d="M12 8.5V13l3.4 2"/>
        </svg>
      </span>
      <span id="timer-text" class="timer-text">45</span>
      <span class="timer-unit">秒</span>
    </div>

    <div class="progress-badge">
      <span>已完成</span>
      <span class="progress-num"><span id="progress-done">0</span>/<b>7</b></span>
    </div>
  </div>

  <!-- 卡牌网格 -->
  <div id="board" class="board" aria-label="翻牌游戏棋盘"></div>

  <!-- 游戏内操作按钮：重新开始 / 结束挑战 -->
  <div class="game-actions">
    <button id="btn-restart" class="btn-restart" type="button">
      <span class="restart-icon star-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4"/>
        </svg>
      </span>
      重新开始
    </button>
    <button id="btn-quit" class="btn-quit" type="button">
      <span class="quit-icon star-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </span>
      结束挑战
    </button>
  </div>

  <p class="game-footer">游戏制作人：艺管263 黄天佑</p>
</main>

<!-- ============================================================
     结果弹窗：通关 / 超时失败（共用一套 UI，标题与文案切换）
     ============================================================ -->
<div id="modal-mask" class="modal-mask" role="dialog" aria-modal="true">
  <div class="modal">
    <div id="modal-emblem" class="modal-emblem star-mark">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2l2.9 6.26 6.6.72-4.9 4.56 1.34 6.7L12 16.9l-5.94 3.34 1.34-6.7L2.5 8.98l6.6-.72L12 2z"/>
      </svg>
    </div>
    <h2 id="modal-title" class="modal-title">闯关完成</h2>
    <p id="modal-desc" class="modal-desc"></p>
    <div class="modal-stats">
      <div class="stat">
        <span class="stat-label">本次用时</span>
        <span id="stat-time" class="stat-value">--</span>
      </div>
      <div class="stat">
        <span class="stat-label">最快纪录</span>
        <span id="stat-best" class="stat-value">--</span>
      </div>
    </div>
    <button id="btn-again" class="btn-restart-lg" type="button">重新挑战</button>
  </div>
</div>

<script>
/* ============================================================
   游戏核心逻辑：长征事件限时翻牌
   ============================================================ */

/* ---------- 一、卡牌配置（★图片替换点★） ----------
   img 字段：留空时卡牌正面显示事件名占位；
   如需替换为 AI 生成的插图，把图片 URL 填进 img 即可，
   例如  img: "https://example.com/zyhy.png"。
   填好后该事件卡自动显示图片，无需改动其它代码。        */
const CARDS = [
  { id: 'zyhy', name: '遵义会议',   img: '' },
  { id: 'sdsc', name: '四渡赤水',   img: '' },
  { id: 'fdlj', name: '飞夺泸定桥', img: '' },
  { id: 'qjdj', name: '巧渡金沙江', img: '' },
  { id: 'paxs', name: '爬雪山',     img: '' },
  { id: 'gucd', name: '过草地',     img: '' },
  { id: 'slhs', name: '胜利会师',   img: '' },
];

const TOTAL_PAIRS = CARDS.length;      // 7 组
const TOTAL_CARDS = TOTAL_PAIRS * 2;   // 14 张
const TIME_LIMIT  = 45;                // 总限时（秒）
const MAX_FLIPPED = 3;                 // 最多同时翻开的卡牌数（翻开第 4 张时最早那张翻回）
const FLIP_TIMEOUT = 3000;             // 单张卡牌最多保持翻开 3 秒，超时自动翻回
const BEST_KEY = 'long-march-flip-best'; // 最快纪录 localStorage 键

/* ---------- 二、游戏状态 ---------- */
const state = {
  deck: [],            // 当前牌堆（每张：{ id, pairId, name, img, matched, flipped }）
  flippedQueue: [],    // 当前翻开的未配对卡牌队列（按翻开顺序，最多 MAX_FLIPPED 张）
  cardTimers: {},      // 每张翻开卡牌的 3 秒回翻定时器（键为牌堆 DOM 索引）
  matchedCount: 0,     // 已成功配对组数
  timeLeft: TIME_LIMIT,
  phase: 'home',       // home | playing | paused | win | lose
  rafId: null,         // 计时 requestAnimationFrame 句柄
  lastTick: 0,
  startAt: 0,          // 本局开始时间戳
};

/* ---------- 三、DOM 引用 ---------- */
const $ = (sel) => document.querySelector(sel);
const boardEl    = $('#board');
const timerText  = $('#timer-text');
const timerBadge = $('#timer-badge');
const progressEl = $('#progress-done');
const viewHome   = $('#view-home');
const viewGame   = $('#view-game');
const modalMask  = $('#modal-mask');
const modalTitle = $('#modal-title');
const modalDesc  = $('#modal-desc');
const statTime   = $('#stat-time');
const statBest   = $('#stat-best');

/* ---------- 四、工具函数 ---------- */

/* Fisher-Yates 洗牌：返回打乱后的数组 */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 读取最快纪录（隐私模式 / 禁用存储时静默失败） */
function readBest() {
  try { return localStorage.getItem(BEST_KEY) || null; }
  catch (e) { return null; }
}
function saveBest(sec) {
  try {
    const old = readBest();
    if (old === null || sec < Number(old)) localStorage.setItem(BEST_KEY, String(sec));
  } catch (e) { /* 忽略存储失败 */ }
}

/* ---------- 五、视图切换 ---------- */
function showView(name) {
  viewHome.classList.toggle('active', name === 'home');
  viewGame.classList.toggle('active', name === 'game');
}

/* ---------- 六、渲染棋盘 ---------- */
function buildDeck() {
  // 每张事件生成两张牌（pairId 相同），再整体洗牌
  const pairs = [];
  CARDS.forEach((c, i) => {
    pairs.push({ id: c.id, pairId: i, name: c.name, img: c.img, matched: false, flipped: false });
    pairs.push({ id: c.id, pairId: i, name: c.name, img: c.img, matched: false, flipped: false });
  });
  state.deck = shuffle(pairs);

  boardEl.innerHTML = '';
  state.deck.forEach((card, idx) => {
    const el = document.createElement('div');
    el.className = 'card' + (card.img ? ' has-img' : '');
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="card-inner">
        <!-- 背面：深红 + 金色纹样 -->
        <div class="card-face card-back">
          <div class="back-content">
            <span class="back-star star-mark">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2l2.9 6.26 6.6.72-4.9 4.56 1.34 6.7L12 16.9l-5.94 3.34 1.34-6.7L2.5 8.98l6.6-.72L12 2z"/>
              </svg>
            </span>
            <span class="back-word">长征</span>
          </div>
        </div>
        <!-- 正面：事件插图位（预留替换点，见 CARDS 配置 img 字段） -->
        <div class="card-face card-front">
          <img class="card-img" src="${card.img || ''}" alt="${card.name}" loading="lazy">
          <div class="front-placeholder">
            <span class="front-star star-mark">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2l2.9 6.26 6.6.72-4.9 4.56 1.34 6.7L12 16.9l-5.94 3.34 1.34-6.7L2.5 8.98l6.6-.72L12 2z"/>
              </svg>
            </span>
            <span class="front-name">${card.name}</span>
            <span class="front-tag">长征记忆</span>
          </div>
        </div>
      </div>`;
    boardEl.appendChild(el);
  });
}

/* ---------- 七、计时器（rAF 驱动，精确倒计时） ---------- */
function startTimer() {
  state.lastTick = performance.now();
  const tick = (now) => {
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;
    state.timeLeft -= dt;
    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      updateTimerUI();
      endGame(false);   // 时间归零 → 直接判定失败
      return;
    }
    updateTimerUI();
    state.rafId = requestAnimationFrame(tick);
  };
  state.rafId = requestAnimationFrame(tick);
}

function stopTimer() {
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.rafId = null;
}

/* 更新倒计时显示；最后 10 秒进入警示状态 */
function updateTimerUI() {
  const sec = Math.max(0, Math.ceil(state.timeLeft));
  timerText.textContent = sec;
  timerBadge.classList.toggle('danger', sec <= 10 && state.phase === 'playing');
}

/* ---------- 八、翻牌与配对（植物大战僵尸式：多张同时翻开） ----------
   规则：
   1. 点牌即翻开，可连续翻开多张；
   2. 翻到两张相同 → 立即配对成功，卡牌保持翻开；
   3. 同时最多 3 张翻开，翻开第 4 张时最早翻开的那张自动翻回；
   4. 每张牌最多翻开 3 秒，超时未配对自动翻回。            */

function onCardClick(idx) {
  if (state.phase !== 'playing') return;
  const card = state.deck[idx];
  if (card.matched || card.flipped) return;   // 已配对 / 已翻开的不再响应

  flipCard(idx, true);
  state.flippedQueue.push(idx);

  // 规则 3：超过同时翻开上限，最早翻开的牌翻回
  while (state.flippedQueue.length > MAX_FLIPPED) {
    const oldest = state.flippedQueue.shift();
    clearTimeout(state.cardTimers[oldest]);
    delete state.cardTimers[oldest];
    flipCard(oldest, false);
  }

  // 规则 2：检查队列中是否有同事件卡 → 配对成功
  const partnerIdx = state.flippedQueue.findIndex(
    (i) => i !== idx && state.deck[i].pairId === card.pairId
  );
  if (partnerIdx !== -1) {
    const aIdx = state.flippedQueue[partnerIdx];

    // 两张标记配对成功，保持翻开状态
    state.deck[idx].matched = true;
    state.deck[aIdx].matched = true;
    state.matchedCount += 1;
    progressEl.textContent = state.matchedCount;

    boardEl.children[idx].classList.add('matched');
    boardEl.children[aIdx].classList.add('matched');

    // 取消两张的 3 秒回翻定时，移出翻开队列
    clearTimeout(state.cardTimers[idx]);
    clearTimeout(state.cardTimers[aIdx]);
    delete state.cardTimers[idx];
    delete state.cardTimers[aIdx];
    state.flippedQueue = state.flippedQueue.filter((i) => i !== idx && i !== aIdx);

    // 全部配对完成 → 通关
    if (state.matchedCount === TOTAL_PAIRS) {
      endGame(true);
    }
    return;
  }

  // 规则 4：本张未配对，3 秒后自动翻回
  state.cardTimers[idx] = setTimeout(() => {
    const c = state.deck[idx];
    if (c.flipped && !c.matched) {
      flipCard(idx, false);
      state.flippedQueue = state.flippedQueue.filter((i) => i !== idx);
    }
    delete state.cardTimers[idx];
  }, FLIP_TIMEOUT);
}

function flipCard(idx, flipped) {
  state.deck[idx].flipped = flipped;
  boardEl.children[idx].classList.toggle('flipped', flipped);
}

/* ---------- 九、开局 / 重置 / 结束 ---------- */

function startGame() {
  stopTimer();
  clearAllTimers();
  state.matchedCount = 0;
  state.flippedQueue = [];
  state.timeLeft = TIME_LIMIT;
  state.startAt = performance.now();
  state.phase = 'playing';

  buildDeck();
  progressEl.textContent = 0;
  timerBadge.classList.remove('danger');
  updateTimerUI();
  showView('game');
  closeModal();
  startTimer();
}

/* 清除所有卡牌回翻定时器（新开局 / 退出时调用） */
function clearAllTimers() {
  Object.keys(state.cardTimers).forEach((k) => clearTimeout(state.cardTimers[k]));
  state.cardTimers = {};
}

/* 结束挑战：停止本局并返回首页 */
function quitToHome() {
  stopTimer();
  clearAllTimers();
  state.flippedQueue = [];
  closeModal();
  showView('home');
  state.phase = 'home';
}

/* 结束一局：win = 通关，lose = 超时 */
function endGame(win) {
  stopTimer();
  state.phase = win ? 'win' : 'lose';
  const used = win ? Math.round((performance.now() - state.startAt) / 1000) : null;
  if (win) saveBest(used);

  // 弹窗文案：通关 / 超时失败
  if (win) {
    modalTitle.textContent = '闯关完成';
    modalDesc.innerHTML = '祝贺你，长征历史画卷已全部复原。<br>可以前往集章啦。';
    statTime.textContent = used + ' 秒';
  } else {
    modalTitle.textContent = '挑战时间耗尽';
    modalDesc.innerHTML = '闯关失败，差一点点。<br>重整旗鼓，再来一局吧。';
    statTime.textContent = '--';
  }
  const best = readBest();
  statBest.textContent = best ? best + ' 秒' : '暂无';
  modalMask.classList.add('open');
}

function closeModal() {
  modalMask.classList.remove('open');
}

/* ---------- 十、事件绑定 ---------- */

// 卡牌点击（Pointer Events 同时兼容鼠标与触屏）
boardEl.addEventListener('click', (e) => {
  const cardEl = e.target.closest('.card');
  if (!cardEl) return;
  onCardClick(Number(cardEl.dataset.idx));
});

// 首页开始游戏
$('#btn-start').addEventListener('click', startGame);

// 游戏内重新开始
$('#btn-restart').addEventListener('click', startGame);

// 游戏内结束挑战：返回首页
$('#btn-quit').addEventListener('click', quitToHome);

// 弹窗重新挑战
$('#btn-again').addEventListener('click', startGame);

// 弹窗遮罩点击关闭（仅通关后允许关闭查看，超时失败也可关闭）
modalMask.addEventListener('click', (e) => {
  if (e.target === modalMask) closeModal();
});

/* ---------- 十一、切后台自动暂停计时 ----------
   手机场景下切出页面（来电 / 切应用）时不浪费倒计时；
   回到页面自动恢复。 */
document.addEventListener('visibilitychange', () => {
  if (state.phase !== 'playing') return;
  if (document.hidden) {
    stopTimer();
    state.phase = 'paused';
  } else if (state.phase === 'paused') {
    state.phase = 'playing';
    state.lastTick = performance.now();
    startTimer();
    updateTimerUI();
  }
});
</script>
</body>
</html>
